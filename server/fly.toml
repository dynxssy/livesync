# Deploy with:  fly launch --copy-config --no-deploy && fly volumes create livesync_data --size 3 && fly deploy
app = "livesync-relay"
primary_region = "fra"

[build]

[env]
  PORT = "8787"
  DATA_DIR = "/data"

[[mounts]]
  source = "livesync_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
